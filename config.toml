[library.site]
title = "compro-env"
description = "Competitive programming libraries verified across Rust, C++, and Lean."
language = "en"
repository_url = "https://github.com/kisepichu/compro-env"

[library.languages.rust]
display_name = "Rust"
root = "libraries/rust"
include = ["**/*.rs"]
exclude = ["**/target/**"]
check_command = "cargo test"
check_timeout_seconds = 600
syntax_highlight = "rust"
entry_file = "src/main.rs"
expected_toolchains = [
  { name = "rustc", version = "1.92.0" },
  { name = "cargo", version = "1.92.0" },
]

[library.languages.rust.analyzer]
command = ["./target/library-analyzers/bin/rust-analyzer"]
timeout_seconds = 600

[library.languages.rust.online_judges.librarychecker]
language_id = "rust"

[library.languages.cpp]
display_name = "C++"
root = "libraries/cpp"
include = ["**/*.hpp", "**/*.cpp"]
exclude = []
check_command = "clang++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only libraries/cpp/algebra/monoid.hpp"
check_timeout_seconds = 600
syntax_highlight = "cpp"
entry_file = "main.cpp"
expected_toolchains = [
  { name = "clang", version = "22.1.0" },
]

[library.languages.cpp.analyzer]
command = ["./target/library-analyzers/bin/cpp-analyzer"]
timeout_seconds = 600

[library.languages.cpp.online_judges.librarychecker]
language_id = "cpp"

[library.languages.lean]
display_name = "Lean"
root = "libraries/lean"
include = ["**/*.lean"]
exclude = []
check_command = "lake build"
check_timeout_seconds = 900
syntax_highlight = "lean"
entry_file = "Main.lean"
expected_toolchains = [
  { name = "lean", version = "4.30.0" },
]

[library.languages.lean.analyzer]
command = ["./target/library-analyzers/bin/lean-analyzer"]
timeout_seconds = 900

[library.languages.lean.online_judges.librarychecker]
language_id = "lean"
