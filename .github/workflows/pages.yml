name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build:
    name: Build site from current main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.record_sha.outputs.source_sha }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages_config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Install Node (pinned via .node-version)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (production pipeline)
        env:
          CE_SITE_BASE: ${{ steps.pages_config.outputs.base_path }}
          CE_SITE_ORIGIN: ${{ steps.pages_config.outputs.origin }}
        run: npm run site:build

      - name: Record artifact source metadata
        id: record_sha
        env:
          SOURCE_SHA: ${{ github.sha }}
          SITE_SCHEMA_VERSION: "1"
        run: |
          set -euo pipefail
          mkdir -p web/dist
          jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg schema "$SITE_SCHEMA_VERSION" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_commit_sha: $sha, site_schema_version: $schema, built_at: $built_at}' \
            > web/dist/build-source.json
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact (temporary)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/dist
          retention-days: 1

  deploy:
    name: Deploy artifact to github-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale rerun — artifact SHA must equal current main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SHA: ${{ needs.build.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          if [ -z "$current_sha" ]; then
            echo "Failed to resolve current main HEAD" >&2
            exit 1
          fi
          if [ "$ARTIFACT_SHA" != "$current_sha" ]; then
            echo "Refusing to deploy artifact for $ARTIFACT_SHA — current main is $current_sha (spec §15.5)." >&2
            exit 1
          fi
          echo "Artifact source $ARTIFACT_SHA matches current main HEAD."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
