name: CI

on:
  push:
    # The verify pipeline pushes three commits to `automation/verify` per live
    # attempt (persist_starting/handle/terminal). Those pushes only touch
    # verification/results/**.json — the Rust code is identical to main — so
    # running the full CI three times per attempt is wasted CI minutes. Skip
    # it explicitly; `verify-result-integrity` covers the data-side checks.
    branches:
      - "**"
      - "!automation/verify"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Cargo test + clippy + fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable @ 2026-08
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --all

      - name: cargo clippy
        run: cargo clippy --all --all-features -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --all --check

      - name: Verify python3 is present (bundler dependency)
        run: python3 --version

      - name: hooks/tests/run.sh (rust bundler regression tests)
        run: bash hooks/tests/run.sh

      - name: Verify clang++ is present (cpp library check dependency)
        run: clang++ --version

      - name: Install pinned Lean toolchain (lean library check dependency)
        # `scripts/check-lean-libraries.sh` only needs `lean` on PATH. The
        # pin mirrors `tools/library-analyzers/dependencies.toml`
        # (`lean-linux-x64`); `./tools/library-analyzers/prepare` is not
        # reused because it also downloads LLVM (~700MB) and `ce check` runs
        # with a sanitized environment (docs/commands/check.md) that carries
        # no path into the prepared set. The release tarball resolves
        # `libLean_shared.so` through its own RPATH, so unlike the analyzer
        # build this needs no `LD_LIBRARY_PATH` plumbing.
        #
        # Deliberately uncached: the extracted toolchain is 2.6GB, so an
        # actions/cache round-trip costs more than refetching the 529MB
        # archive from GitHub's CDN.
        run: |
          set -euo pipefail
          url="https://github.com/leanprover/lean4/releases/download/v4.30.0/lean-4.30.0-linux.tar.zst"
          sha256="4dad74141c2c119ca1aa626656be83b8e14238afba97271fd7bf1eb3f081b319"
          curl -sSfL --retry 3 --retry-connrefused -o "$RUNNER_TEMP/lean.tar.zst" "$url"
          echo "$sha256  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lean/bin/lean" --version

      # No `--language` filter: clang++ ships with the runner image and the
      # step above installs Lean, so all three languages are checkable here.
      - name: ce check (library checks for every language)
        run: cargo run --bin ce -- check

  site:
    name: Static site build (root + /compro-env/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Node (pinned via .node-version)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify Node version matches .node-version
        run: |
          expected="$(cat .node-version)"
          actual="$(node --version | sed 's/^v//')"
          if [ "$expected" != "$actual" ]; then
            echo "Node mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "node=$actual"
          echo "npm=$(npm --version)"

      - name: Install dependencies (lockfile-only)
        run: npm ci

      - name: Cache validation (npm cache directory present after ci)
        run: |
          test -d node_modules/astro
          test -d node_modules/pagefind
          test -d node_modules/shiki

      - name: Build both bases (/ and /compro-env/) with link and CSP checks
        run: npm run verify:builds

      - name: Full site pipeline (schema, exact index, Astro, Pagefind, verify)
        run: npm run site:build

      - name: Publish size and toolchain summary
        run: |
          {
            echo "### Toolchain identity"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo ""
            echo "### Site artifact sizes"
            for dir in web/dist web/dist-root web/dist-compro-env; do
              if [ -d "$dir" ]; then
                bytes=$(du -sb "$dir" | awk '{print $1}')
                printf -- "- %s: %d bytes (%.1f KiB)\n" "$dir" "$bytes" "$(awk "BEGIN{print $bytes/1024}")"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  content:
    # Closes the gap issue #125 describes: the `site` job above pins the Web
    # pipeline against `web/tests/fixtures/site-data.json`, so nothing in PR
    # CI ever looked at the libraries and solutions actually committed to
    # this repository. That job stays fixture-bound on purpose (it is the
    # renderer's input-boundary regression test); this one runs the same
    # generator/build pair `pages.yml` runs after merge, against the real
    # tree, so content mistakes fail here instead of on the deploy.
    name: Real-content site-data build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # `ce site-data generate` resolves `library.updated_at` from
          # `git log` per source path and fails when a published library has
          # no recorded history, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable @ 2026-08
        with:
          toolchain: 1.92.0

      - name: Install Node (pinned via .node-version)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # `target/library-analyzers` is excluded: it holds the extracted
          # LLVM and Lean installs (multiple GB) and already has two
          # dedicated caches below. Without the exclusion this entry would
          # swallow them and blow the repository cache budget.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/library-analyzers
          key: ${{ runner.os }}-cargo-content-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-content-
            ${{ runner.os }}-cargo-

      - name: Cache prepared adapter dependencies
        # Same key as pages.yml / verify.yml / verify-worker.yml. Those run
        # on `main`, and default-branch caches are visible to every PR, so
        # this job normally restores instead of re-downloading ~1.2GB.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/library-analyzers/prepared
          key: ${{ runner.os }}-analyzers-prepared-${{ hashFiles('tools/library-analyzers/dependencies.toml') }}

      - name: Cache built analyzer binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            target/library-analyzers/builds
            target/library-analyzers/bin
          key: ${{ runner.os }}-analyzers-builds-${{ hashFiles('tools/library-analyzers/**', 'crates/library-adapter-protocol/**', 'crates/domain/src/adapter_build.rs', 'crates/domain/src/adapter_prepare.rs', 'crates/infrastructure/src/library_adapter/**', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install dependencies (lockfile-only)
        run: npm ci

      - name: Install analyzer build dependencies
        # `library-adapter-build` compiles cpp-analyzer with cmake + ninja;
        # ubuntu-latest ships neither. Unconditional so a cache miss on the
        # builds key never lands on a runner without them.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Prepare library analyzer dependencies
        run: ./tools/library-analyzers/prepare

      - name: Build library analyzer executables
        # Mirrors pages.yml: `--check` returns 0 even when nothing is built
        # yet, so test the `bin` symlink first to tell "warm cache" apart
        # from "never built".
        run: |
          set -euo pipefail
          if [ -L target/library-analyzers/bin ] && ./tools/library-analyzers/build --check; then
            echo "Warm cache: analyzer build already finalized."
            exit 0
          fi
          ./tools/library-analyzers/build

      - name: Generate site-data from the committed libraries and solutions
        # This is where content mistakes surface: discovery rejects malformed
        # or unknown sidecar frontmatter keys, empty titles, orphan sidecars,
        # and `[verify].libraries` entries that name a non-public library,
        # all before the analyzers are even invoked.
        run: cargo run --bin ce -- site-data generate --mode preview

      - name: Build the site from the real site-data
        # `--mode preview` matches pages.yml. Running the Web pipeline over
        # real site-data costs a few seconds on top of the generator and
        # catches schema / renderer failures that only real IDs, real
        # dependency graphs, and real verification state can produce.
        run: npm run site:build -- --fixture=target/ce-site-data/site-data.json
