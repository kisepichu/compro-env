name: verify-result-integrity

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'verification/results/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    if: github.event.pull_request.head.ref == 'automation/verify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Build ce
        run: cargo build --release --bin ce
      - name: Validate result-only PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `automation/verify` diverges from `main` from the point at which
          # the initial verify record was persisted, so a two-dot diff
          # (`main..head`) shows every subsequent main commit as an inverted
          # deletion and misclassifies the PR as `SourceOrConfig`. Use the
          # merge-base so the classifier only sees paths the head branch
          # actually adds — matching GitHub's three-dot PR compare view.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          ./target/release/ce internal verify-validate-result-pr --before "$merge_base" --after "$HEAD_SHA"
