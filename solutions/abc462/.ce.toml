[[problems]]
id = "abc462_f"
code = "f"
title = "More ABC"
input_format_raw = '''
T
\mathrm{case}_1
\mathrm{case}_2
\vdots
\mathrm{case}_T

S
K
'''
constraints_raw = '''
1\leq T\leq 10^5

S は英大文字のみからなる長さ 3 以上 3\times 10^5 以下の文字列

1\leq K \leq 10

それぞれの入力において、各テストケースの S の長さの総和は 3\times 10^5 以下である。

T,K は整数'''

