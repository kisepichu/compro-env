# Deterministic build inputs for language adapters (spec §6.9).
#
# The core hashes each `directories` entry recursively and each `files` entry
# individually, framed by the target platform, to derive the `build-id` under
# `target/library-analyzers/builds/`. Adapter source directories are added by
# later plans (043–050) alongside their `prepare` / `build` scripts and
# toolchain pins.
#
# `tools/library-analyzers/cpp/` also holds the checked-in
# `compile-profile.toml` (plan 046). It is picked up by the recursive
# directory hash so any change to the C++ compile flags forces a fresh
# `build-id`, keeping the cached `cpp-analyzer` in lockstep with the profile
# it is expected to read.

directories = [
    "crates/library-adapter-protocol",
    "tools/library-analyzers/protocol",
    "tools/library-analyzers/rust",
    "tools/library-analyzers/cpp",
]

files = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "tools/library-analyzers/build",
    "tools/library-analyzers/build-inputs.toml",
    "tools/library-analyzers/dependencies.toml",
    "tools/library-analyzers/prepare",
]
