[package]
name = "ce-library-rust-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[lib]
name = "ce_library_rust_analyzer"
path = "src/lib.rs"

[[bin]]
name = "rust-analyzer"
path = "src/main.rs"

[dependencies]
library-adapter-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
